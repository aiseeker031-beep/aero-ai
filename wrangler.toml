name = "ai-insider"
main = "src/worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "ARTICLES"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"

[ai]
binding = "AI"

[triggers]
crons = ["0 9 * * *"]
